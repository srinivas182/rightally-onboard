name: Refresh composer.lock
on:
  push:
    branches: [deps-lock]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, gd, intl, bcmath
          coverage: none
      - run: composer update --no-install --no-scripts --no-interaction
      - run: |
          git config user.name ci-bot && git config user.email ci-bot@users.noreply.github.com
          git add composer.lock && git commit -m "composer.lock for $(git rev-parse --short HEAD)" && git push
