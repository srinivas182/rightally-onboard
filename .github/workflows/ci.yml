name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, gd, intl, bcmath
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Build front end
        run: npm install --no-audit --no-fund && npm run build

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          if ! php artisan test --compact 2>&1 | tee test-output.txt; then
            # Surface the failure summary as an annotation so it is readable from the API and the PR page.
            msg=$(tail -c 60000 test-output.txt | sed -e 's/\x1b\[[0-9;]*m//g' | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=Test failures::${msg}"
            exit 1
          fi

      # Temporary diagnostic (Sprint 1 takeover): publish test output to the ci-logs branch
      - name: Publish test output
        if: failure()
        shell: bash
        run: |
          mkdir -p /tmp/logs && cp test-output.txt /tmp/logs/ 2>/dev/null || true
          git config user.name ci-bot && git config user.email ci-bot@users.noreply.github.com
          git checkout --orphan ci-logs && git rm -rfq . && cp /tmp/logs/test-output.txt .
          git add test-output.txt && git commit -qm "Test output for ${GITHUB_SHA}" && git push -fq origin ci-logs
