# RightAlly Onboarding: Nginx site. server-setup.sh fills in __DOMAIN__ and __APP_DIR__.
# Certbot adds the HTTPS server block and the HTTP-to-HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    root __APP_DIR__/public;
    index index.php;
    charset utf-8;
    client_max_body_size 8m;
    server_tokens off;

    # If Cloudflare proxies this site, uncomment to log real visitor IPs
    # (and set TRUSTED_PROXIES in .env to Cloudflare's ranges).
    # include /etc/nginx/cloudflare-realip.conf;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.png { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
    }

    # Never serve dotfiles (.env, .git) or anything outside public/.
    location ~ /\.(?!well-known).* { deny all; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
