; RightAlly Onboarding queue worker (sends emails). server-setup.sh fills in the placeholders.
[program:rightally-queue]
command=php __APP_DIR__/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=__APP_DIR__
user=__APP_USER__
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=__APP_DIR__/storage/logs/queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
